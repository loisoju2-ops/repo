<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Government and You · ADC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Poppins',sans-serif; background:#f5f7f6; color:#1f2e2b; line-height:1.5; min-height:100vh; }
    a { text-decoration:none; color:inherit; }
    button { font-family:'Poppins',sans-serif; cursor:pointer; border:none; }

    .topbar {
      background:#fff; border-bottom:1px solid #dfe7e4;
      padding:16px 28px; display:flex; align-items:center; gap:14px;
      position:sticky; top:0; z-index:100;
    }
    .logo-icon {
      width:40px; height:40px; background:#0f6b3e; color:#fff;
      border-radius:12px; display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:1.05rem;
    }
    .topbar-title { font-weight:600; font-size:.95rem; }
    .topbar-title span { display:block; font-size:.7rem; color:#4f5f5c; font-weight:400; }
    .topbar-back {
      margin-left:auto; padding:8px 16px; border-radius:40px;
      background:#e6f3ec; color:#0f6b3e; font-weight:500; font-size:.85rem;
      display:inline-flex; align-items:center; gap:6px;
    }
    .topbar-back:hover { background:#d3ebde; }

    .wrap { max-width:760px; margin:0 auto; padding:40px 20px 60px; }

    .form-card {
      background:#fff; border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      border:1px solid #dfe7e4; padding:36px 32px;
    }
    .form-header { margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid #dfe7e4; }
    .form-header h1 { font-size:1.6rem; font-weight:600; color:#1f2e2b; margin-bottom:8px; }
    .badge {
      display:inline-block; padding:6px 14px; border-radius:40px;
      font-size:.78rem; font-weight:500; background:#f4ecf7; color:#8e44ad;
    }
    .form-header p { color:#4f5f5c; font-size:.88rem; margin-top:10px; }

    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .form-group { display:flex; flex-direction:column; margin-bottom:18px; }
    .form-group label { font-size:.85rem; font-weight:500; margin-bottom:6px; color:#1f2e2b; }
    .form-group label .req { color:#c0392b; margin-left:3px; }
    .form-control {
      width:100%; padding:13px 16px; border:1.5px solid #dfe7e4;
      border-radius:12px; font-family:'Poppins',sans-serif; font-size:.9rem;
      background:#fefefe; transition:.2s;
    }
    .form-control:focus { outline:none; border-color:#0f6b3e; box-shadow:0 0 0 4px rgba(15,107,62,.08); }
    textarea.form-control { min-height:130px; resize:vertical; }

    .radio-group { display:flex; gap:24px; padding:12px 0; }
    .radio-item { display:flex; align-items:center; gap:8px; cursor:pointer; }
    .radio-item input[type="radio"] {
      width:18px; height:18px; accent-color:#0f6b3e; cursor:pointer;
    }
    .radio-item span { font-size:.9rem; font-weight:400; }

    .form-footer {
      display:flex; justify-content:flex-end; gap:12px;
      margin-top:24px; padding-top:20px; border-top:1px solid #dfe7e4;
    }
    .btn {
      padding:12px 26px; border-radius:40px; font-weight:500; font-size:.9rem;
      display:inline-flex; align-items:center; gap:8px; transition:.2s;
    }
    .btn-primary { background:#0f6b3e; color:#fff; }
    .btn-primary:hover { background:#0b5a33; transform:translateY(-1px); }
    .btn-outline { background:transparent; border:1.5px solid #0f6b3e; color:#0f6b3e; }
    .btn-outline:hover { background:#e6f3ec; }

    .success-card {
      max-width:560px; margin:60px auto; background:#fff;
      border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.06);
      padding:48px 32px; text-align:center; border:1px solid #dfe7e4;
    }
    .success-card i { font-size:3rem; color:#0f6b3e; margin-bottom:18px; }
    .success-card h2 { font-size:1.5rem; margin-bottom:10px; color:#1f2e2b; }
    .success-card .ref-box {
      background:#e6f3ec; padding:16px; border-radius:12px;
      margin:20px 0; font-size:1.1rem; font-weight:700;
      letter-spacing:1px; color:#0f6b3e;
    }
    @media (max-width:560px) {
      .form-card { padding:24px 18px; }
      .form-row { grid-template-columns:1fr; gap:0; }
      .form-footer { flex-direction:column; }
      .form-footer .btn { width:100%; justify-content:center; }
      .topbar { padding:12px 16px; }
      .radio-group { flex-direction:column; gap:12px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo-icon">ADC</div>
  <div class="topbar-title">
    African Diaspora Channels
    <span>The Government and You</span>
  </div>
  <a href="index.html" class="topbar-back"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="wrap">
  <div id="pageContent"></div>
</div>

<script>
  function generateRef(prefix) {
    var y = new Date().getFullYear();
    var s = Date.now().toString().slice(-8);
    var r = Math.floor(Math.random() * 90 + 10);
    return prefix + '-' + y + '-' + s + r;
  }

  function renderForm() {
    var container = document.getElementById('pageContent');
    container.innerHTML =
      '<div class="form-card">' +
        '<div class="form-header">' +
          '<h1>The Government and You · Guest Record</h1>' +
          '<div class="badge"><i class="fas fa-landmark"></i> The Government and You</div>' +
          '<p>Record details of guests who have appeared on The Government and You.</p>' +
        '</div>' +
        '<form id="guestForm">' +

          '<div class="form-group">' +
            '<label>Guest Name <span class="req">*</span></label>' +
            '<input type="text" class="form-control" id="guestName" required>' +
          '</div>' +

          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Guest Age <span class="req">*</span></label>' +
              '<input type="number" class="form-control" id="guestAge" min="1" max="120" required>' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Guest Profession / Specialty <span class="req">*</span></label>' +
              '<input type="text" class="form-control" id="guestProfession" required>' +
            '</div>' +
          '</div>' +

          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Guest Email <span class="req">*</span></label>' +
              '<input type="email" class="form-control" id="guestEmail" required>' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Guest Phone Number <span class="req">*</span></label>' +
              '<input type="tel" class="form-control" id="guestPhone" required>' +
            '</div>' +
          '</div>' +

          '<div class="form-group">' +
            '<label>Guest Commentary <span class="req">*</span></label>' +
            '<textarea class="form-control" id="guestCommentary" required placeholder="What did the guest discuss? Key points, quotes, highlights..."></textarea>' +
          '</div>' +

          '<div class="form-group">' +
            '<label>Appearance Type <span class="req">*</span></label>' +
            '<div class="radio-group">' +
              '<label class="radio-item">' +
                '<input type="radio" name="paidStatus" value="Paid" required>' +
                '<span><i class="fas fa-dollar-sign" style="color:#0f6b3e; margin-right:4px;"></i> Paid</span>' +
              '</label>' +
              '<label class="radio-item">' +
                '<input type="radio" name="paidStatus" value="Free" required>' +
                '<span><i class="fas fa-gift" style="color:#e67e22; margin-right:4px;"></i> Free</span>' +
              '</label>' +
            '</div>' +
          '</div>' +

          '<div class="form-footer">' +
            '<a href="index.html" class="btn btn-outline"><i class="fas fa-times"></i> Cancel</a>' +
            '<button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Guest Record</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    document.getElementById('guestForm').addEventListener('submit', handleSubmit);
  }

  function handleSubmit(e) {
    e.preventDefault();
    var name = document.getElementById('guestName').value.trim();
    var age = document.getElementById('guestAge').value;
    var profession = document.getElementById('guestProfession').value.trim();
    var email = document.getElementById('guestEmail').value.trim();
    var phone = document.getElementById('guestPhone').value.trim();
    var commentary = document.getElementById('guestCommentary').value.trim();
    var paidStatus = document.querySelector('input[name="paidStatus"]:checked');

    if (!name || !age || !profession || !email || !phone || !commentary) {
      alert('Please fill in all required fields.');
      return;
    }

    if (!paidStatus) {
      alert('Please select whether the appearance was Paid or Free.');
      return;
    }

    var ref = generateRef('ADC-GOV');
    showSuccess(name, ref, age, profession, email, phone, paidStatus.value);
  }

  function showSuccess(name, ref, age, profession, email, phone, paidStatus) {
    var statusColor = paidStatus === 'Paid' ? '#0f6b3e' : '#e67e22';
    var statusIcon = paidStatus === 'Paid' ? 'fa-dollar-sign' : 'fa-gift';

    document.getElementById('pageContent').innerHTML =
      '<div class="success-card">' +
        '<i class="fas fa-check-circle"></i>' +
        '<h2>Guest Record Saved</h2>' +
        '<p><strong>' + name + '</strong> has been added to The Government and You records.</p>' +
        '<div class="ref-box">' + ref + '</div>' +
        '<p style="color:#4f5f5c; font-size:.85rem; margin-top:8px;">' +
          '<strong>Age:</strong> ' + age + ' &nbsp;·&nbsp; ' +
          '<strong>Profession:</strong> ' + profession + '<br>' +
          '<strong>Email:</strong> ' + email + ' &nbsp;·&nbsp; ' +
          '<strong>Phone:</strong> ' + phone + '<br>' +
          '<strong>Appearance:</strong> <span style="color:' + statusColor + '; font-weight:600;">' +
            '<i class="fas ' + statusIcon + '"></i> ' + paidStatus +
          '</span>' +
        '</p>' +
        '<div style="margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">' +
          '<a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Return Home</a>' +
          '<a href="government-and-you.html" class="btn btn-outline"><i class="fas fa-plus"></i> Add Another Guest</a>' +
        '</div>' +
      '</div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderForm);
  } else {
    renderForm();
  }
</script>

</body>
</html>
